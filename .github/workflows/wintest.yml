# Runs the real-mouse Windows test (test/win) when the wintest branch is pushed,
# and commits the results (text + screenshots) to the wintest-results branch.
name: Windows input test
on:
  push:
    branches: [wintest]
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run
        run: node test/win/run.js
        continue-on-error: true
      - name: Publish results
        if: always()
        shell: bash
        run: |
          cd wout
          rm -rf profile
          git init -q -b wintest-results
          git config user.name ci; git config user.email ci@example.invalid
          git add -A && git commit -qm "results $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" wintest-results
