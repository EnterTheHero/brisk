# Runs the real-mouse Windows test (test/win) when the wintest branch is pushed.
name: Windows input test
on:
  push:
    branches: [wintest]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run
        shell: bash
        run: |
          mkdir -p wout
          timeout 240 ./node_modules/electron/dist/electron.exe test/win/real-input.js --out=$PWD/wout || true
          cat wout/result.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wout
          path: wout/*.png
