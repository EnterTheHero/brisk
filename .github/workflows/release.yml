# Builds Brisk for Windows and Mac and publishes a GitHub Release.
# Runs when the version in package.json changes on main (or a v* tag is pushed, or by hand
# from the Actions tab). A version that already has a release is skipped.
# Installed copies of Brisk check the latest release for updates.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            echo "v$VERSION is already released"; echo build=false >> "$GITHUB_OUTPUT"
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer (Squirrel)
        run: npx electron-builder --win --x64 --publish never
      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Brisk $VERSION" --notes "Brisk $VERSION" 2>/dev/null || true
          gh release upload "v$VERSION" \
            "release/squirrel-windows/Brisk-Setup-$VERSION.exe" \
            "release/squirrel-windows/Brisk-$VERSION-full.nupkg" \
            "release/squirrel-windows/RELEASES" --clobber

  mac:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build apps (Apple Silicon and Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Sign (ad-hoc) and zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for pair in "mac-arm64:AppleSilicon" "mac:Intel"; do
            dir="${pair%%:*}"; label="${pair##*:}"
            codesign --force --deep --sign - "release/$dir/Brisk.app"
            codesign --verify --deep --strict "release/$dir/Brisk.app"
            ditto -c -k --keepParent "release/$dir/Brisk.app" "release/Brisk-$VERSION-mac-$label.zip"
          done
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Brisk $VERSION" --notes "Brisk $VERSION" 2>/dev/null || true
          gh release upload "v$VERSION" release/Brisk-$VERSION-mac-*.zip --clobber
