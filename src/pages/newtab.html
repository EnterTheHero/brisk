<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'" />
    <title>New Tab</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="nt">
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
      <div class="stat" id="stat" hidden></div>
      <div class="tiles" id="tiles"></div>
    </main>
    <div class="customize">
      <button id="customize" title="Customize this page">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8.5 8"/></svg>
        <span>Customize</span>
      </button>
      <div class="cust-menu" id="cust-menu" hidden>
        <button id="bg-choose">Choose background picture…</button>
        <button id="bg-remove">Remove background</button>
      </div>
    </div>
    <script src="theme.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
